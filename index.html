    // Client-side image compression for fast & free Firestore document photo storage
    function compressImageFile(file, maxWidth = 800, quality = 0.82) {
      return new Promise((resolve) => {
        if (!file || !file.type.startsWith("image/")) {
          resolve(null);
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

      const handleClearFirebaseConfig = () => {

      const handleSeedInitialDataToCloud = async () => {

        setFirebaseStatusMsg("Seeding all garments to Cloud Firestore...");
        try {
          const batch = db.batch();
          products.forEach((p) => {
            const docRef = db.collection("yd_products").doc(String(p.id));
            batch.set(docRef, p, { merge: true });
          });
          categories.forEach((c) => {
            const docId = c.name.replace(/[^a-zA-Z0-9_-]/g, "_");
            const docRef = db.collection("yd_categories").doc(docId);
            batch.set(docRef, c, { merge: true });
          });
          brands.forEach((b) => {
            const docId = b.name.replace(/[^a-zA-Z0-9_-]/g, "_");
            const docRef = db.collection("yd_brands").doc(docId);
            batch.set(docRef, b, { merge: true });
          });
          await batch.commit();
          setFirebaseStatusMsg("✅ Successfully uploaded boutique garments to Firebase Firestore!");
        } catch (err) {
          setFirebaseStatusMsg("Error seeding to cloud: " + err.message);
        } finally {
          setIsSeedingCloud(false);

      const handleSaveEmailSettings = (e) => {

      const [form, setForm] = useState({
        name: "", category: "Formal Shirts", brand: "Zodiac", price: 1499, mrp: 1899,

      }).length;

      const filteredProds = products.filter((p) => {

        return true;

      const handleImageFiles = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        setIsUploadingImages(true);
        try {
          const compressedList = [];
          for (const file of files) {
            const res = await compressImageFile(file);
            if (res) {
              compressedList.push(res);
            } else {
              const dataUrl = await new Promise((resolve) => {
                const r = new FileReader();
                r.onloadend = () => resolve(r.result);
                r.onerror = () => resolve(null);
                r.readAsDataURL(file);
              });
              if (dataUrl) compressedList.push(dataUrl);
            }
          }
          if (compressedList.length > 0) {
            setForm((prev) => {
              const existing = Array.isArray(prev.images) && prev.images.length > 0
                ? prev.images
                : (prev.image ? [prev.image] : []);
              const merged = [...existing, ...compressedList];
              return {
                ...prev,
                images: merged,
                image: merged[0] || null
              };
            });
          }
        } catch (err) {
          console.error("Error processing photos:", err);
        } finally {
          setIsUploadingImages(false);
          e.target.value = "";
        }
      };

      const handleAddDirectUrl = () => {
        const url = directImageUrl.trim();

        setForm((prev) => {
          const existing = Array.isArray(prev.images) && prev.images.length > 0
            ? prev.images
            : (prev.image ? [prev.image] : []);
          const merged = [...existing, url];
          return {
            ...prev,
            images: merged,
            image: merged[0] || null
          };
        });

      const handleRemovePhoto = (indexToRemove) => {
        setForm((prev) => {
          const existing = Array.isArray(prev.images) ? prev.images : (prev.image ? [prev.image] : []);
          const updated = existing.filter((_, idx) => idx !== indexToRemove);
          return {
            ...prev,
            images: updated,
            image: updated[0] || null
          };
        });
      };

      const handleMakeCoverPhoto = (indexToCover) => {
        setForm((prev) => {
          const existing = Array.isArray(prev.images) ? [...prev.images] : (prev.image ? [prev.image] : []);
          if (indexToCover < 0 || indexToCover >= existing.length) return prev;
          const [selected] = existing.splice(indexToCover, 1);
          existing.unshift(selected);
          return {
            ...prev,
            images: existing,
            image: existing[0] || null
          };
        });
      };

      const handleMovePhoto = (fromIdx, direction) => {
        setForm((prev) => {
          const existing = Array.isArray(prev.images) ? [...prev.images] : (prev.image ? [prev.image] : []);
          const toIdx = fromIdx + direction;
          if (toIdx < 0 || toIdx >= existing.length) return prev;
          const temp = existing[fromIdx];
          existing[fromIdx] = existing[toIdx];
          existing[toIdx] = temp;
          return {
            ...prev,
            images: existing,
            image: existing[0] || null
          };
        });
      };

      const handleClearAllPhotos = () => {

            const db = getActiveFirestoreDb();
            if (db) db.collection("yd_products").doc(String(id)).set(nextP, { merge: true }).catch(() => { });
            return nextP;
          }
          return p;
        });
        saveProducts(updated);
      };

      const updateStockVal = (id, sz, val) => {
        const q = Math.max(0, parseInt(val, 10) || 0);
        const updated = products.map((p) => {
          if (p.id === id) {
            const current = typeof p.stock === 'object' ? { ...p.stock } : { S: 0, M: 0, L: 0 };
            current[sz] = q;
            const total = Object.values(current).reduce((a, b) => a + Number(b), 0);
            const nextP = { ...p, stock: current, inStock: total > 0 && p.inStock };
            const db = getActiveFirestoreDb();
            if (db) db.collection("yd_products").doc(String(id)).set(nextP, { merge: true }).catch(() => { });

          }
          return p;
        });
        saveProducts(updated);

        const finalIn = totalSt > 0 && form.inStock;

    /* -------------------------------- MAIN APP CONTAINER ------------------------- */
    function App() {
      const [page, setPage] = useState("home");
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [isMerchantAuth, setIsMerchantAuth] = useState(false);
      const [showMerchantModal, setShowMerchantModal] = useState(false);

      const [query, setQuery] = useState("");
      const [activeCategory, setActiveCategory] = useState(null);
      const [activeBrand, setActiveBrand] = useState("all");
      const [selectedProduct, setSelectedProduct] = useState(null);

      const [products, setProducts] = useState(() => safeLoad(KEYS.PRODUCTS, INITIAL_PRODUCTS));
      const [categories, setCategories] = useState(() => safeLoad(KEYS.CATEGORIES, INITIAL_CATEGORIES));
      const [brands, setBrands] = useState(() => safeLoad(KEYS.BRANDS, INITIAL_BRANDS));
      const [orders, setOrders] = useState(() => safeLoad(KEYS.ORDERS, INITIAL_ORDERS));
      const [cart, setCart] = useState(() => safeLoad(KEYS.CART, []));
      const [wishlist, setWishlist] = useState(() => safeLoad(KEYS.WISHLIST, []));
      const [user, setUser] = useState(() => safeLoad(KEYS.USER, null));
      const [cartOpen, setCartOpen] = useState(false);
      const [lastOrder, setLastOrder] = useState(null);
      const [showInquiryModal, setShowInquiryModal] = useState(false);
      const [inquiryProduct, setInquiryProduct] = useState(null);

      const handleOpenInquiry = (prod = null) => {
        setInquiryProduct(prod);
        setShowInquiryModal(true);
      };

      // Centralized Navigation with Browser History Stack Support
      const navigateTo = (newPage, newCat = null, newProd = null, newBrand = "all", push = true) => {
        setPage(newPage);
        setActiveCategory(newCat);
        setSelectedProduct(newProd);
        setActiveBrand(newBrand);

        if (push && typeof window !== "undefined" && window.history) {
          const stateObj = {
            page: newPage,
            category: newCat,
            prodId: newProd ? newProd.id : null,
            brand: newBrand
          };
          window.history.pushState(stateObj, "");
        }
      };

      const handleOpenCategory = (cat) => {
        navigateTo("shop", cat, null, "all");
      };

      const handleOpenProduct = (prod) => {
        navigateTo("product", prod.category || activeCategory, prod, activeBrand);
      };

      const goBack = () => {
        if (typeof window !== "undefined" && window.history.state) {
          window.history.back();
        } else if (page === "product") {
          navigateTo("shop", activeCategory, null, activeBrand, false);
        } else if (page === "shop" || page === "checkout" || page === "orders") {
          navigateTo("home", null, null, "all", false);
        } else {
          navigateTo("home", null, null, "all", false);
        }
      };

      // Listen for browser Back/Forward (Previous/Next) button events
      useEffect(() => {
        const handlePopState = (e) => {
          if (e.state) {
            setPage(e.state.page || "home");
            setActiveCategory(e.state.category || null);
            setActiveBrand(e.state.brand || "all");
            if (e.state.prodId) {
              const currentProds = safeLoad(KEYS.PRODUCTS, INITIAL_PRODUCTS);
              const found = currentProds.find(p => p.id === e.state.prodId);
              setSelectedProduct(found || null);
            } else {
              setSelectedProduct(null);
            }
          } else {
            setPage("home");
            setActiveCategory(null);
            setActiveBrand("all");
            setSelectedProduct(null);
          }
        };

        // Initialize root history state
        if (typeof window !== "undefined" && window.history) {
          window.history.replaceState({ page: "home", category: null, prodId: null, brand: "all" }, "");
          window.addEventListener("popstate", handlePopState);
          return () => window.removeEventListener("popstate", handlePopState);
        }
      }, []);

      const segmentScrollRef = useRef(null);

      const scrollSegments = (dir) => {
        if (segmentScrollRef.current) {
          const dx = dir === 'left' ? -280 : 280;
          segmentScrollRef.current.scrollBy({ left: dx, behavior: 'smooth' });
        }
      };

      const updateProds = (p) => { setProducts(p); safeSave(KEYS.PRODUCTS, p); };
      const updateCats = (c) => { setCategories(c); safeSave(KEYS.CATEGORIES, c); };
      const updateBrands = (b) => { setBrands(b); safeSave(KEYS.BRANDS, b); };
      const updateOrds = (o) => { setOrders(o); safeSave(KEYS.ORDERS, o); };
      const updateCart = (c) => { setCart(c); safeSave(KEYS.CART, c); };
      const updateWish = (w) => { setWishlist(w); safeSave(KEYS.WISHLIST, w); };

      // Real-time Firestore sync listener across all connected devices & customers
      useEffect(() => {
        const db = getActiveFirestoreDb();
        if (!db) return;

        const unsubs = [];

        // 1. Sync live products (Auto-seeds initial catalog if Firestore is fresh & empty)
        try {
          const u1 = db.collection("yd_products").onSnapshot((snap) => {
            if (!snap.empty) {
              const live = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              if (live.length > 0) {
                setProducts(live);
                safeSave(KEYS.PRODUCTS, live);
              }
            } else {
              // Auto-seed initial catalog to Firestore
              try {
                const batch = db.batch();
                INITIAL_PRODUCTS.forEach((p) => {
                  batch.set(db.collection("yd_products").doc(String(p.id)), p, { merge: true });
                });
                INITIAL_CATEGORIES.forEach((c) => {
                  const docId = c.name.replace(/[^a-zA-Z0-9_-]/g, "_");
                  batch.set(db.collection("yd_categories").doc(docId), c, { merge: true });
                });
                INITIAL_BRANDS.forEach((b) => {
                  const docId = b.name.replace(/[^a-zA-Z0-9_-]/g, "_");
                  batch.set(db.collection("yd_brands").doc(docId), b, { merge: true });
                });
                batch.commit().catch(console.warn);
              } catch (e) { }
            }
          }, (err) => console.warn("Firestore products sync:", err));
          unsubs.push(u1);
        } catch (e) { }

        // 2. Sync live categories
        try {
          const u2 = db.collection("yd_categories").onSnapshot((snap) => {
            if (!snap.empty) {
              const live = snap.docs.map(doc => ({ name: doc.data().name || doc.id }));
              if (live.length > 0) {
                setCategories(live);
                safeSave(KEYS.CATEGORIES, live);
              }
            }
          }, (err) => console.warn("Firestore categories sync:", err));
          unsubs.push(u2);
        } catch (e) { }

        // 3. Sync live brands
        try {
          const u3 = db.collection("yd_brands").onSnapshot((snap) => {
            if (!snap.empty) {
              const live = snap.docs.map(doc => ({ name: doc.data().name || doc.id }));
              if (live.length > 0) {
                setBrands(live);
                safeSave(KEYS.BRANDS, live);
              }
            }
          }, (err) => console.warn("Firestore brands sync:", err));
          unsubs.push(u3);
        } catch (e) { }

        // 4. Sync live orders
        try {
          const u4 = db.collection("yd_orders").onSnapshot((snap) => {
            if (!snap.empty) {
              const live = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              if (live.length > 0) {
                setOrders(live);
                safeSave(KEYS.ORDERS, live);
              }
            }
          }, (err) => console.warn("Firestore orders sync:", err));
          unsubs.push(u4);
        } catch (e) { }

        return () => {
          unsubs.forEach(fn => fn && fn());
        };
      }, []);

      const addToCart = (product, size, qty) => {
        if (!product || !size) return;
        updateCart((c) => {
          const idx = c.findIndex(i => i.id === product.id && i.size === size);
          if (idx > -1) {
            const next = [...c]; next[idx].qty += qty; return next;
          }
          return [...c, { id: product.id, size, qty }];
        });
        setCartOpen(true);
      };

      const updateQty = (id, size, delta) => {
        updateCart((c) => c.map(i => (i.id === id && i.size === size ? { ...i, qty: Math.max(1, i.qty + delta) } : i)));
      };

      const removeItem = (id, size) => {
        updateCart((c) => c.filter(i => !(i.id === id && i.size === size)));
      };

      const handleOpenMerchantPortal = () => {
        if (isAdminMode) {
          setIsAdminMode(false);
          setPage("home");
        } else {
          setShowMerchantModal(true);
        }
      };

      const handleMerchantAuthenticated = (merchantUser) => {
        setIsMerchantAuth(true);
        safeSave(KEYS.MERCHANT_AUTH, true);
        setShowMerchantModal(false);
        setIsAdminMode(true);
        setPage("admin");
      };

      const handleMerchantLogout = () => {
        setIsMerchantAuth(false);
        safeSave(KEYS.MERCHANT_AUTH, false);
        setIsAdminMode(false);
        setPage("home");
      };

      const placeOrder = (items, total, address, paymentMethod, transactionId) => {
        const order = {
          id: `YD-ORD-${Math.floor(2200 + Math.random() * 7000)}`,
          date: new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }),
          total, paymentMethod, transactionId,
          items: items.map(i => ({ id: i.id, name: i.product.name, size: i.size, qty: i.qty, price: i.product.price })),
          address
        };

        // Deduct Stock
        const updatedProds = products.map(p => {
          const orderHits = items.filter(i => i.id === p.id);
          if (!orderHits.length) return p;
          const newStock = typeof p.stock === 'object' ? { ...p.stock } : { S: 0 };
          orderHits.forEach(h => {
            newStock[h.size] = Math.max(0, (newStock[h.size] || 0) - h.qty);
          });
          const tot = Object.values(newStock).reduce((a, b) => a + Number(b), 0);
          return { ...p, stock: newStock, inStock: tot > 0 && p.inStock };
        });

        updateProds(updatedProds);
        updateOrds([order, ...orders]);
        setLastOrder(order);

        // Sync order and updated stock to Firestore
        const db = getActiveFirestoreDb();
        if (db) {
          db.collection("yd_orders").doc(String(order.id)).set(order, { merge: true }).catch(console.warn);
          updatedProds.forEach(p => {
            const orderHits = items.filter(i => i.id === p.id);
            if (orderHits.length) {
              db.collection("yd_products").doc(String(p.id)).set(p, { merge: true }).catch(console.warn);
            }
          });
        }
        updateCart([]);
        setPage("confirmation");

        // Automatically dispatch order confirmation email from dressesyashal@gmail.com to yashaldressespune@gmail.com
        sendOrderConfirmationEmail(order);
      };

      const cartCount = cart.reduce((s, i) => s + i.qty, 0);

      return (
        <div className="yd-root min-h-screen flex flex-col">
          <BrandStyles />
          <CurtainIntro />

          <Header
            setPage={setPage} query={query} setQuery={setQuery}
            cartCount={cartCount} onCartClick={() => setCartOpen(true)}
            user={user} onLoginClick={() => setUser({ name: "Shopper Customer" })}
            isAdminMode={isAdminMode} setIsAdminMode={setIsAdminMode}
            onOpenMerchantPortal={handleOpenMerchantPortal}
            isMerchantAuth={isMerchantAuth}
            onInquiryClick={() => handleOpenInquiry(null)}
          />

          <main className="flex-1">
            {isAdminMode ? (
              <AdminDashboard
                products={products} saveProducts={updateProds}
                categories={categories} saveCategories={updateCats}
                brands={brands} saveBrands={updateBrands}
                orders={orders}
                onLogoutMerchant={handleMerchantLogout}
              />
            ) : (
              <>
                {page === "home" && (
                  <div>
                    <Hero setPage={setPage} setActiveCategory={handleOpenCategory} products={products} />

                    {/* Segments horizontal rail with Left & Right scroll buttons */}
                    <section className="max-w-7xl mx-auto px-4 md:px-6 py-14">
                      <div className="flex items-end justify-between mb-6">
                        <div>
                          <p className="font-mono text-[11px] tracking-widest yd-mustard font-bold">01 · SHOP BY SEGMENT</p>
                          <h2 className="font-display text-2xl md:text-3xl mt-1 font-semibold" style={{ color: "#8A5A3B" }}>
                            Every rack, tagged.
                          </h2>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => scrollSegments('left')}
                            className="w-9 h-9 rounded-full border border-[var(--mustard)] bg-white text-[var(--ink)] flex items-center justify-center font-mono font-bold text-sm shadow hover:bg-[var(--mustard)] hover:text-black transition-all active:scale-95"
                            title="Scroll Left"
                          >
                            ←
                          </button>
                          <button
                            onClick={() => scrollSegments('right')}
                            className="w-9 h-9 rounded-full border border-[var(--mustard)] bg-white text-[var(--ink)] flex items-center justify-center font-mono font-bold text-sm shadow hover:bg-[var(--mustard)] hover:text-black transition-all active:scale-95"
                            title="Scroll Right"
                          >
                            →
                          </button>
                        </div>
                      </div>

                      <div ref={segmentScrollRef} className="flex gap-3 overflow-x-auto pb-4 scrollbar-none snap-x snap-mandatory scroll-smooth">
                        {categories.map((c) => {
                          const p = products.find((x) => x.category === c.name) || products[0];
                          return (
                            <button
                              key={c.name}
                              onClick={() => handleOpenCategory(c.name)}
                              className="tag-card text-left shrink-0 w-36 snap-start group"
                            >
                              <div className="tag-hole" />
                              <Swatch p={p} className="h-28 w-full" />
                              <div className="tag-stitch px-3 py-2.5 bg-white">
                                <p className="text-[13px] leading-tight font-medium group-hover:text-[var(--mustard-deep)] transition-colors">{c.name}</p>
                                <p className="font-mono text-[9px] opacity-50 mt-0.5 uppercase">Explore →</p>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </section>

                    <MeasuringTape />

                    {/* Bestsellers */}
                    <section className="max-w-7xl mx-auto px-4 md:px-6 py-14">
                      <div className="flex items-end justify-between mb-6">
                        <div>
                          <p className="font-mono text-[11px] tracking-widest yd-mustard font-bold">02 · MOST WORN</p>
                          <h2 className="font-display text-2xl md:text-3xl mt-1 font-semibold">Bestsellers this month.</h2>
                        </div>
                        <button onClick={() => { setActiveCategory(null); setActiveBrand("all"); setPage("shop"); }} className="font-mono text-xs underline underline-offset-4 hidden sm:block">
                          View all garments →
                        </button>
                      </div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-5">
                        {products.slice(0, 4).map((p, i) => (
                          <ProductCard
                            key={p.id} p={p} index={i}
                            onOpen={(prod) => handleOpenProduct(prod)}
                            wishlist={wishlist} toggleWish={(id) => updateWish(wishlist.includes(id) ? wishlist.filter(x => x !== id) : [...wishlist, id])}
                            addToCart={addToCart}
                          />
                        ))}
                      </div>
                    </section>

                    {/* Festive Banner */}
                    <FestiveBanner setPage={(pg) => navigateTo(pg)} setActiveCategory={handleOpenCategory} />

                    {/* Fresh Arrivals */}
                    <section className="max-w-7xl mx-auto px-4 md:px-6 py-14">
                      <div className="flex items-end justify-between mb-6">
                        <div>
                          <p className="font-mono text-[11px] tracking-widest yd-mustard font-bold">03 · JUST IN</p>
                          <h2 className="font-display text-2xl md:text-3xl mt-1 font-semibold">Fresh off the rack.</h2>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-5">
                        {products.slice(4, 8).map((p, i) => (
                          <ProductCard
                            key={p.id} p={p} index={i}
                            onOpen={(prod) => handleOpenProduct(prod)}
                            wishlist={wishlist} toggleWish={(id) => updateWish(wishlist.includes(id) ? wishlist.filter(x => x !== id) : [...wishlist, id])}
                            addToCart={addToCart}
                          />
                        ))}
                      </div>
                    </section>
                  </div>
                )}

                {page === "shop" && (() => {
                  const segmentProds = products.filter(p => !activeCategory || p.category === activeCategory);

                  const brandMap = {};
                  segmentProds.forEach(p => {
                    const b = p.brand || "Yashal Workroom";
                    brandMap[b] = (brandMap[b] || 0) + 1;
                  });
                  const availableBrands = Object.entries(brandMap).map(([name, count]) => ({ name, count }));

                  const filteredProds = segmentProds.filter(p => {
                    const matchesBrand = activeBrand === "all" || (p.brand || "Yashal Workroom") === activeBrand;
                    const matchesQuery = !query.trim() ||
                      p.name.toLowerCase().includes(query.toLowerCase()) ||
                      p.category.toLowerCase().includes(query.toLowerCase()) ||
                      (p.brand && p.brand.toLowerCase().includes(query.toLowerCase()));
                    return matchesBrand && matchesQuery;
                  });

                  return (
                    <div className="max-w-7xl mx-auto px-4 md:px-6 py-8">
                      {/* Segment Header */}
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-[10px] tracking-widest yd-mustard font-bold uppercase">
                              SEGMENT · {activeCategory ? activeCategory.toUpperCase() : "ALL RACKS"}
                            </span>
                            <span className="font-mono text-[10px] opacity-50">• {segmentProds.length} total garments</span>
                          </div>
                          <h1 className="font-display text-2xl md:text-3xl font-bold mt-0.5">
                            {activeCategory || "All Garments & Accessories"}
                          </h1>
                        </div>

                        {activeCategory ? (
                          <button
                            onClick={() => navigateTo("shop", null, null, "all")}
                            className="font-mono text-xs text-[var(--ink)] bg-white border border-[var(--line)] px-3.5 py-1.5 rounded-full hover:bg-[var(--mustard)] hover:text-black font-semibold transition-all shadow-sm w-fit flex items-center gap-1.5"
                          >
                            <span>←</span>
                            <span>View All Segments</span>
                          </button>
                        ) : (
                          <button
                            onClick={() => navigateTo("home", null, null, "all")}
                            className="font-mono text-xs text-[var(--ink)] bg-white border border-[var(--line)] px-3.5 py-1.5 rounded-full hover:bg-[var(--mustard)] hover:text-black font-semibold transition-all shadow-sm w-fit flex items-center gap-1.5"
                          >
                            <span>←</span>
                            <span>Back to Home</span>
                          </button>
                        )}
                      </div>

                      {/* Horizontal Brands Name Click Buttons Bar */}
                      <div className="mb-6 bg-white/90 border border-[var(--line)] rounded-xl p-3 shadow-sm backdrop-blur-sm">
                        <div className="flex items-center gap-2 overflow-x-auto no-scrollbar scroll-smooth">
                          <div className="flex items-center gap-1.5 font-mono text-[11px] font-bold text-gray-500 uppercase tracking-wider shrink-0 px-2 border-r border-gray-200">
                            <span>🏷️ Brands</span>
                          </div>

                          {/* All Brands Click Button (Default Active) */}
                          <button
                            onClick={() => setActiveBrand("all")}
                            className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold font-mono transition-all flex items-center gap-1.5 ${activeBrand === "all"
                              ? "bg-[var(--ink)] text-[var(--mustard)] shadow font-bold border border-[var(--mustard)]/40"
                              : "bg-white text-gray-700 hover:bg-amber-50 hover:text-black border border-gray-200"
                              }`}
                          >
                            <span>All {activeCategory ? activeCategory : ""} Brands</span>
                            <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${activeBrand === "all" ? "bg-[var(--mustard)] text-[var(--ink)]" : "bg-gray-100 text-gray-600"
                              }`}>
                              {segmentProds.length}
                            </span>
                          </button>

                          {/* Individual Brand Click Buttons */}
                          {availableBrands.map((b) => (
                            <button
                              key={b.name}
                              onClick={() => setActiveBrand(activeBrand === b.name ? "all" : b.name)}
                              className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium transition-all flex items-center gap-1.5 ${activeBrand === b.name
                                ? "bg-[var(--ink)] text-[var(--mustard)] shadow font-bold border border-[var(--mustard)] ring-2 ring-[var(--mustard)]/30"
                                : "bg-white text-gray-700 hover:bg-amber-50 hover:text-black border border-gray-200"
                                }`}
                            >
                              <span>{b.name}</span>
                              <span className={`text-[10px] font-mono px-1.5 py-0.2 rounded-full font-bold ${activeBrand === b.name ? "bg-[var(--mustard)] text-[var(--ink)]" : "bg-gray-100 text-gray-500"
                                }`}>
                                {b.count}
                              </span>
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Products Grid */}
                      {filteredProds.length === 0 ? (
                        <div className="text-center py-16 bg-white/50 rounded-xl border border-dashed border-[var(--line)] p-8">
                          <p className="font-display text-xl mb-2 font-semibold">No garments found for this brand.</p>
                          <p className="text-xs opacity-60 mb-4 font-mono">Try selecting another brand or resetting to view all garments.</p>
                          <button
                            onClick={() => setActiveBrand("all")}
                            className="yd-btn yd-btn-primary px-5 py-2 text-xs font-bold"
                          >
                            Show All {activeCategory || "Garment"} Brands
                          </button>
                        </div>
                      ) : (
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5">
                          {filteredProds.map((p, i) => (
                            <ProductCard
                              key={p.id} p={p} index={i}
                              onOpen={(prod) => handleOpenProduct(prod)}
                              wishlist={wishlist} toggleWish={(id) => updateWish(wishlist.includes(id) ? wishlist.filter(x => x !== id) : [...wishlist, id])}
                              addToCart={addToCart}
                            />
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })()}

                {page === "product" && selectedProduct && (
                  <StandaloneProductPage
                    product={selectedProduct}
                    goBack={goBack}
                    activeCategory={activeCategory}
                    addToCart={addToCart}
                    handleOpenInquiry={handleOpenInquiry}
                  />
                )}

                {page === "checkout" && (
                  <CheckoutPage cart={cart} products={products} setPage={setPage} placeOrder={placeOrder} user={user} />
                )}

                {page === "confirmation" && <ConfirmationPage order={lastOrder} setPage={setPage} />}
              </>
            )}
          </main>

          {/* Luxury Store Footer */}
          {!isAdminMode && (
            <Footer
              setPage={(p) => navigateTo(p)}
              setActiveCategory={handleOpenCategory}
              onOpenInquiry={() => handleOpenInquiry(null)}
            />
          )}

          {/* Floating Inquiry Helpline Button */}
          {!isAdminMode && (
            <FloatingInquiryButton onClick={() => handleOpenInquiry(null)} />
          )}

          {/* Store Inquiry & Helpline Modal */}
          <InquiryModal
            open={showInquiryModal}
            close={() => { setShowInquiryModal(false); setInquiryProduct(null); }}
            initialProduct={inquiryProduct}
          />

          <CartDrawer
            open={cartOpen}
            close={() => setCartOpen(false)}
            cart={cart}
            products={products}
            updateQty={updateQty}
            removeItem={removeItem}
            setPage={setPage}
          />

          <MerchantLoginModal
            open={showMerchantModal}
            close={() => setShowMerchantModal(false)}
            onAuthenticate={handleMerchantAuthenticated}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
